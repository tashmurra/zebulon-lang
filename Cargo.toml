[workspace]
members = ["crates/zeb-frontend", "crates/zebc", "crates/zeb-runtime"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Native tool fingerprints hash large LLVM and Rust libraries even in debug tests.
[profile.dev.package.sha2]
opt-level = 3
