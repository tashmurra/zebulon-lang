name: Compiler and runtime
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.98.1 x86_64-apple-darwin aarch64-apple-darwin
      - name: Install LLVM build prerequisites
        if: runner.arch == 'X64'
        run: brew install cmake ninja
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zeb-llvm
          key: llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Configure LLVM
        run: |
          python3 tools/bootstrap_llvm.py "$RUNNER_TEMP/zeb-llvm" > "$RUNNER_TEMP/llvm-setup.log"
          tail -n 1 "$RUNNER_TEMP/llvm-setup.log" > "$RUNNER_TEMP/llvm-env.sh"
          source "$RUNNER_TEMP/llvm-env.sh"
          echo "ZEB_LLVM_CONFIG=$ZEB_LLVM_CONFIG" >> "$GITHUB_ENV"
      - name: Check source and Rust tests
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 tools/check_repository.py
      - name: Run native tests on the host architecture
        run: cargo test -p zebc --locked -- --ignored --test-threads=1
