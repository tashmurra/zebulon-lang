name: Compiler and runtime
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    name: Native build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: zebc-linux-x86_64
            binary: target/release/zebc
          - os: windows-2025
            artifact: zebc-windows-x86_64
            binary: target/release/zebc.exe
          - os: macos-15
            artifact: zebc-macos-universal
            binary: target/universal/zebc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Initialize Windows SDK and MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Install macOS target libraries
        if: runner.os == 'macOS'
        run: rustup target add --toolchain 1.98.1 x86_64-apple-darwin aarch64-apple-darwin
      - uses: actions/cache/restore@v4
        id: llvm-cache
        with:
          path: ${{ runner.temp }}/zeb-llvm/installation
          key: llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-prebuilt-v1
      - name: Configure LLVM
        shell: bash
        run: |
          python tools/bootstrap_llvm.py "$RUNNER_TEMP/zeb-llvm" --config-out "$RUNNER_TEMP/zeb-llvm.json"
          python -c 'import json, os; p=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "zeb-llvm.json"))); print("ZEB_LLVM_CONFIG=" + p["llvm_config"])' >> "$GITHUB_ENV"
      - name: Save validated LLVM toolchain
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/zeb-llvm/installation
          key: llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-prebuilt-v1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test prebuilt LLVM bootstrap
        run: python tools/test_bootstrap_llvm.py
      - name: Check repository
        run: python -X utf8 tools/check_repository.py
      - name: Build release compiler and runtime
        run: cargo build --workspace --release --locked
      - name: Build and verify universal macOS compiler
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          cargo build -p zebc --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin
          llvm_bin="$("$ZEB_LLVM_CONFIG" --bindir)"
          mkdir -p target/universal
          "$llvm_bin/llvm-lipo" -create target/aarch64-apple-darwin/release/zebc target/x86_64-apple-darwin/release/zebc -output target/universal/zebc
          "$llvm_bin/llvm-lipo" target/universal/zebc -verify_arch arm64 x86_64
          target/universal/zebc build examples/scalar.t --model ownership --emit shared --opt O2 --out-dir "$RUNNER_TEMP/universal compiler smoke"
          test "$("$RUNNER_TEMP/universal compiler smoke/consumer" 20)" = 41
      - name: Run native tests on the host architecture
        run: cargo test -p zebc --locked -- --ignored --test-threads=1
      - name: Upload compiler
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
